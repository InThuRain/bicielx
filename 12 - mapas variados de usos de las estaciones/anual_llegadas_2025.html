        if (raw) {

            if (s && typeof s.lat === "number" && typeof s.lng === "number" && typeof s.zoom === "number") {
                map.setView([s.lat, s.lng], s.zoom);
            }

            var z = map.getZoom();
            localStorage.setItem("bicielx_map_state", JSON.stringify({lat: c.lat, lng: c.lng, zoom: z}));
        });
    } catch(e) {
        console.log("sync error", e);
    }
})();
